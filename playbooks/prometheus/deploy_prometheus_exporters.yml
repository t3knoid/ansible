---
# Purpose: Refresh Prometheus exporter scrape targets
# Usage: ansible-playbook playbooks/prometheus/deploy_prometheus_exporters.yml
# Note: This refreshes exporter targets from the current inventory into the Prometheus config.
# Requires the full combined inventory (ansible.cfg's default inventory=inventory/) so every
# service's exporter group (node_exporter, postgres_exporter, pve_exporter, etc.) is visible.
# Do not scope this run with -i to a single inventory subfolder.

- name: Refresh Prometheus exporter scrape config
  hosts: prometheus
  become: true
  gather_facts: true
  roles:
    - global
  tasks:
    - name: Import exporter scrape config tasks from prometheus_setup role
      ansible.builtin.import_role:
        name: prometheus_setup
        tasks_from: exporters.yml
