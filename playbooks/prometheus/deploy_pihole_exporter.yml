---
# Purpose: Deploy the Pi-hole exporter on Pi-hole DNS hosts for Prometheus monitoring
# Usage: ansible-playbook -i inventory/dns/inventory.ini playbooks/prometheus/deploy_pihole_exporter.yml
# Then refresh Prometheus targets: ansible-playbook playbooks/prometheus/deploy_prometheus_exporters.yml

- name: Deploy Pi-hole exporter
  hosts: pihole_exporter
  become: true
  gather_facts: false
  vars_files:
    # Reuse the pihole role's vaulted pihole_password as the exporter's default password.
    - ../../roles/pihole/defaults/main/vault.yml
  roles:
    - global
    - pihole_exporter_setup
