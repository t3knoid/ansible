---

# Purpose: Deploy and configure code-server on target hosts
- name: Install and configure code-server
  hosts: code_server
  become: true
  gather_facts: true
  roles:
    - global
    - nginx_setup
    - code_server

  pre_tasks:
    - name: Create a Proxmox snapshot before upgrading
      ansible.builtin.import_role:
        name: vms
        tasks_from: snapshot_create
      when:
        - inventory_hostname in groups.get('vms', [])
