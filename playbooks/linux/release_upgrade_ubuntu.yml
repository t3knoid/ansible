---
# Purpose: Upgrades one Ubuntu 24.04 VM to Ubuntu 26.04 LTS.

- name: Upgrade one Ubuntu VM to the next LTS release
  hosts: linux
  gather_facts: true
  become: true
  serial: 1
  vars:
    linux_release_upgrade_confirm: false
    # Proxmox snapshot names only allow letters, digits, '-' and '_'.
    vms_snapshot_name: "pre-ubuntu-{{ linux_release_upgrade_target_version | replace('.', '_') }}-{{ ansible_date_time.epoch }}"

  pre_tasks:
    - name: Require explicit confirmation and a single-host limit
      ansible.builtin.assert:
        that:
          - linux_release_upgrade_confirm | bool
          - ansible_limit is defined
          - ansible_limit | length > 0
          - ansible_play_hosts_all | length == 1
          - ansible_distribution == "Ubuntu"
          - ansible_distribution_version == "24.04"
        fail_msg: >-
          Set linux_release_upgrade_confirm=true and use --limit to select
          exactly one VM.

  roles:
    - global

  tasks:
    - name: Create a Proxmox snapshot before upgrading
      ansible.builtin.import_role:
        name: vms
        tasks_from: snapshot_create

    - name: Upgrade Ubuntu to the next LTS release
      ansible.builtin.import_role:
        name: linux
        tasks_from: release_upgrade_ubuntu
