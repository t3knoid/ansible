---
# Purpose: Installs Semaphore UI application on semaphore hosts.

- name: Deploy postgresql
  ansible.builtin.import_playbook: ../postgresql/deploy_postgresql.yml

- name: Create the SemaphoreUI database
  ansible.builtin.import_playbook: create_db.yml

- name: Install Ansible
  ansible.builtin.import_playbook: ../ansible/deploy_ansible.yml

- name: Deploy Semaphore UI
  hosts: semaphore
  gather_facts: true
  become: true
  roles:
    - global
    - sshpass
    - autofs
    - azure_cli_setup
  tasks:
    - name: Register Entra ID application and inject OIDC secrets
      ansible.builtin.import_role:
        name: entra_id_oauth2

    - name: Apply entra_id_oauth2 injected secrets to rproxy_setup_sites
      ansible.builtin.set_fact:
        rproxy_setup_sites: "{{ entra_id_oauth2_updated_sites }}"
      when: entra_id_oauth2_updated_sites is defined

    - name: Deploy Semaphore UI application
      ansible.builtin.import_role:
        name: semaphoreui_setup
