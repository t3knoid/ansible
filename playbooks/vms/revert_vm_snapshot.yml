---

# Purpose: Reverts virtual machines to a specified snapshot and starts them.
# Usage: ansible-playbook -k -i inventory/<name>/inventory.ini playbooks/vms/revert_vm_snapshot.yml
# -k (SSH password) is required because the reverted guest may not accept the controller's SSH key.

- name: Revert snapshot
  hosts: vms
  gather_facts: false
  roles:
    - global

  tasks:
    - name: Import snapshot_revert task from vms role
      ansible.builtin.import_role:
        name: vms
        tasks_from: snapshot_revert

    - name: Import start task from vms role
      ansible.builtin.import_role:
        name: vms
        tasks_from: start
