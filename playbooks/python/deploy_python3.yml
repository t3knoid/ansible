---
# Purpose: Deploy Python3 on python hosts.

- name: Install Python3
  hosts: python
  become: true
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: Check whether the Python3 virtual environment exists
      ansible.builtin.raw: >-
        '{{ python3_venv_folder }}/bin/python3' -c
        'import sys; sys.exit(0 if sys.version_info[:2] == tuple(map(int, "{{ python3_version }}".split(".")[:2])) else 1)'
      register: python3_venv_check
      changed_when: false
      failed_when: false

    - name: Remove invalid Python3 virtual environment
      ansible.builtin.raw: "rm -rf -- '{{ python3_venv_folder }}'"
      when: python3_venv_check.rc != 0
      changed_when: true

    - name: Bootstrap Python3 when the virtual environment is missing
      ansible.builtin.import_role:
        name: python3
        tasks_from: bootstrap.yml
      when: python3_venv_check.rc != 0

    - name: Gather facts after Python environment is ready
      ansible.builtin.setup:
        gather_subset:
          - min

    - name: Configure Python3
      ansible.builtin.import_role:
        name: python3
