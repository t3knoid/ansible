---
- name: Install packages required for Calibre update metrics
  ansible.builtin.apt:
    name:
      - cron
      - curl
      - jq
    state: present

- name: Ensure Calibre update metrics directory exists
  ansible.builtin.file:
    path: "{{ calibre_setup_update_metrics_path | dirname }}"
    state: directory
    owner: root
    group: "{{ node_exporter_setup_group | default('prometheus') }}"
    mode: "0775"

- name: Install Calibre update metrics script
  ansible.builtin.template:
    src: check_calibre_update.sh.j2
    dest: "{{ calibre_setup_update_check_script_path }}"
    owner: root
    group: root
    mode: "0750"

- name: Seed Calibre update metrics
  ansible.builtin.command: "{{ calibre_setup_update_check_script_path }}"
  changed_when: true

- name: Schedule Calibre update metrics check
  ansible.builtin.cron:
    name: calibre_update_metrics
    minute: "{{ calibre_setup_update_check_minute }}"
    user: root
    job: "{{ calibre_setup_update_check_script_path }}"
