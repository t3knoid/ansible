---
- name: Verify supported Ubuntu release-upgrade source
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version == "24.04"
      - linux_release_upgrade_target_version == "26.04"
    fail_msg: >-
      This workflow supports Ubuntu 24.04 LTS upgrading to 26.04 LTS only.

- name: Upgrade installed Ubuntu packages first
  ansible.builtin.include_tasks: updates.yml

# The update run may schedule a deferred reboot that would interrupt the release upgrade.
- name: Cancel any deferred reboot scheduled by the update run
  ansible.builtin.command:
    argv:
      - systemctl
      - stop
      - linux-updates-reboot.timer
  register: linux_release_upgrade_cancel_reboot
  changed_when: linux_release_upgrade_cancel_reboot.rc == 0
  failed_when: false

- name: Check whether the package upgrade requires a reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: linux_release_upgrade_reboot_required

- name: Reboot after package upgrades
  ansible.builtin.reboot:
    reboot_timeout: 1800
  when: linux_release_upgrade_reboot_required.stat.exists

- name: Install Ubuntu release upgrader
  ansible.builtin.apt:
    name: update-manager-core
    state: present
    update_cache: true

- name: Configure LTS release upgrades
  ansible.builtin.lineinfile:
    path: /etc/update-manager/release-upgrades
    regexp: "^Prompt="
    line: "Prompt=lts"
    create: true
    mode: "0644"

- name: Start the Ubuntu LTS release upgrade
  ansible.builtin.command:
    argv:
      - do-release-upgrade
      - -f
      - DistUpgradeViewNonInteractive
  async: 14400
  poll: 0
  register: linux_release_upgrade_job
  changed_when: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Verify the release upgrade using the system Python
  vars:
    # The ansible.cfg venv is built on the old release's Python and may not survive the upgrade.
    ansible_python_interpreter: /usr/bin/python3
  block:
    - name: Wait for the upgraded host to become reachable
      ansible.builtin.wait_for_connection:
        delay: 30
        connect_timeout: 10
        sleep: 15
        timeout: 7200

    # os-release flips to the new version early (base-files), so wait on the upgrader itself.
    - name: Wait for do-release-upgrade to finish
      ansible.builtin.raw: pgrep -f '[D]istUpgradeViewNonInteractive' >/dev/null && echo running || echo done
      register: linux_release_upgrade_running
      changed_when: false
      until: "'done' in linux_release_upgrade_running.stdout"
      retries: 480
      delay: 30

    - name: Check for packages left unconfigured by the upgrade
      ansible.builtin.raw: dpkg --audit
      register: linux_release_upgrade_dpkg_audit
      changed_when: false
      failed_when: linux_release_upgrade_dpkg_audit.stdout | trim | length > 0

    - name: Check whether the release upgrade requires a final reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: linux_release_upgrade_final_reboot_required

    - name: Reboot after the release upgrade
      ansible.builtin.reboot:
        reboot_timeout: 1800
      when: linux_release_upgrade_final_reboot_required.stat.exists

    - name: Gather Ubuntu facts after the final reboot
      ansible.builtin.setup:
        gather_subset:
          - min
      register: linux_release_upgrade_final_facts

    - name: Confirm Ubuntu reached the requested release
      ansible.builtin.assert:
        that:
          - linux_release_upgrade_final_facts.ansible_facts.ansible_distribution == "Ubuntu"
          - linux_release_upgrade_final_facts.ansible_facts.ansible_distribution_version == linux_release_upgrade_target_version
        fail_msg: "Ubuntu did not reach {{ linux_release_upgrade_target_version }}."
