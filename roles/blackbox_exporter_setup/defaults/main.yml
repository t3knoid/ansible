---
blackbox_exporter_setup_version: "0.25.0"
blackbox_exporter_setup_platform: "linux-amd64"
blackbox_exporter_setup_download_url: "https://github.com/prometheus/blackbox_exporter/releases/download/v{{ blackbox_exporter_setup_version }}/blackbox_exporter-{{ blackbox_exporter_setup_version }}.{{ blackbox_exporter_setup_platform }}.tar.gz"
blackbox_exporter_setup_install_dir: "/opt/blackbox_exporter-{{ blackbox_exporter_setup_version }}.{{ blackbox_exporter_setup_platform }}"
blackbox_exporter_setup_home: "/opt/blackbox_exporter"
blackbox_exporter_setup_binary: "/usr/local/bin/blackbox_exporter"
blackbox_exporter_setup_mode: "0755"
blackbox_exporter_port: 9115
blackbox_exporter_setup_listen_address: "0.0.0.0:{{ blackbox_exporter_port }}"
blackbox_exporter_setup_user: "blackbox-exporter"
blackbox_exporter_setup_group: "blackbox-exporter"
blackbox_exporter_setup_service_name: "blackbox_exporter"
blackbox_exporter_setup_service_file: "/etc/systemd/system/blackbox_exporter.service"
blackbox_exporter_setup_service_mode: "0644"
blackbox_exporter_setup_config_dir: "/etc/blackbox_exporter"
blackbox_exporter_setup_config_file: "{{ blackbox_exporter_setup_config_dir }}/blackbox.yml"
blackbox_exporter_setup_log_level: "info"
blackbox_exporter_setup_modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      preferred_ip_protocol: ip4
  https_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      preferred_ip_protocol: ip4
      fail_if_ssl: false
  tcp_connect:
    prober: tcp
    timeout: 5s
  # --- Service request-path probes (see service_path_services) ---
  icmp_ipv4:
    prober: icmp
    timeout: 3s
    icmp:
      preferred_ip_protocol: ip4
  tcp_connect_ipv4:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
  # Plain HTTP request against a reverse proxy or backend. Pass the virtual host with the
  # `hostname` URL parameter (__param_hostname) so the correct nginx server block is selected.
  # Redirects are not followed: a 301 means the vhost is missing and nginx fell back to the default server.
  http_vhost_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      preferred_ip_protocol: ip4
      follow_redirects: false
  # Lenient variant for apps whose health path redirects to a login page or requires auth:
  # any 2xx/3xx/401/403 answer proves the app responded, except a redirect to the nginx catch-all
  # destination, which means the vhost is missing and another server block answered.
  http_vhost_reachable:
    prober: http
    timeout: 5s
    http:
      method: GET
      preferred_ip_protocol: ip4
      follow_redirects: false
      valid_status_codes: [200, 204, 301, 302, 303, 307, 308, 401, 403]
      fail_if_header_matches:
        - header: Location
          regexp: "/projects/home-lab"
  # HTTPS against rproxy-0 directly (internal path). `hostname` sets both the Host header and TLS SNI.
  # oauth2 variant: an unauthenticated request must return the oauth2-proxy sign-in page (401/403),
  # which proves TLS + nginx vhost + oauth2-proxy are working on the front proxy.
  https_frontdoor_oauth2:
    prober: http
    timeout: 5s
    http:
      method: GET
      preferred_ip_protocol: ip4
      follow_redirects: false
      fail_if_not_ssl: true
      valid_status_codes: [401, 403]
      fail_if_body_not_matches_regexp:
        - "OAuth2_Proxy|oauth2/static"
  https_frontdoor_open:
    prober: http
    timeout: 5s
    http:
      method: GET
      preferred_ip_protocol: ip4
      follow_redirects: false
      fail_if_not_ssl: true
      # 401/403 = the app's own login, 502-504 = rproxy-0 answered but the backend did not
      valid_status_codes: [200, 204, 301, 302, 303, 307, 308, 401, 403, 502, 503, 504]
  # HTTPS through a Cloudflare edge IP (external path). The response must carry `Server: cloudflare`
  # and come from the origin (oauth2 sign-in page), so Cloudflare error pages (52x) and WAF blocks fail.
  https_edge_oauth2:
    prober: http
    timeout: 10s
    http:
      method: GET
      preferred_ip_protocol: ip4
      follow_redirects: false
      fail_if_not_ssl: true
      valid_status_codes: [401, 403]
      fail_if_header_not_matches:
        - header: Server
          regexp: "cloudflare"
      fail_if_body_not_matches_regexp:
        - "OAuth2_Proxy|oauth2/static"
  https_edge_open:
    prober: http
    timeout: 10s
    http:
      method: GET
      preferred_ip_protocol: ip4
      follow_redirects: false
      fail_if_not_ssl: true
      # 401/403 = the app's own login, 502-504 = rproxy-0 answered but the backend did not
      valid_status_codes: [200, 204, 301, 302, 303, 307, 308, 401, 403, 502, 503, 504]
      fail_if_header_not_matches:
        - header: Server
          regexp: "cloudflare"

# Per-service DNS modules (dns_public_<service>, dns_internal_<service>) are generated from this list,
# because the Blackbox DNS prober takes the query name from the module, not from the target.
blackbox_exporter_setup_service_path_services: "{{ service_path_services | default([]) }}"
# Answer the internal resolvers must return for each fqdn (split DNS points at the front proxy).
blackbox_exporter_setup_service_path_front_proxy: "{{ groups['rproxy_main'] | default([]) | first | default('') }}"
