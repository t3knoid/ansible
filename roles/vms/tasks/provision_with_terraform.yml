---
- name: Serialize the Terraform provisioning workflow
  block:
    - name: Acquire the VM workflow lock
      ansible.builtin.include_tasks: terraform_lock_acquire.yml

    - name: Check whether VM provisioning is required
      ansible.builtin.include_tasks: provision_check.yml

    - name: Validate Terraform ownership before deciding to skip initialization
      ansible.builtin.include_tasks: terraform_ownership_preflight.yml

    - name: Provision a new or unfinished VM using Terraform
      when: vms_provision_required | bool
      block:
        - name: Create cloud-init snippets
          ansible.builtin.include_tasks: cloud_init_create_snippets.yml

        - name: Clone VM from a template if VM does not exist
          ansible.builtin.include_tasks: clone_vm_from_template_terraform.yml

        - name: Migrate virtual machine
          ansible.builtin.include_tasks: migrate.yml
          when: >-
            (vms_provision_matches[0].node if vms_provision_matches | length == 1
             else vms_proxmox_template.node) != vms_proxmox_node

        - name: Start virtual machine and start the cloud-init process
          ansible.builtin.include_tasks: start.yml

        - name: Wait for cloud-init to finish
          ansible.builtin.include_tasks: cloud_init_wait.yml

        - name: Update known_hosts file
          ansible.builtin.include_tasks: known_hosts.yml

        - name: Finalize provisioning with a recoverable checkpoint
          ansible.builtin.include_tasks: provision_finalize.yml

    - name: Recover interrupted finalization without repeating Terraform creation
      when: vms_finalization_required | bool
      block:
        - name: Start the existing guest for finalization recovery
          ansible.builtin.include_tasks: start.yml

        - name: Complete pending finalization
          ansible.builtin.include_tasks: provision_finalize.yml
  always:
    - name: Release the VM workflow lock
      ansible.builtin.include_tasks: terraform_lock_release.yml
