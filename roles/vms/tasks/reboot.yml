---
- name: Reboot the guest and verify a new boot ID and connection
  ansible.builtin.reboot:
    reboot_timeout: 600
    connect_timeout: 20
    boot_time_command: cat /proc/sys/kernel/random/boot_id
    test_command: whoami
  become: true
  vars:
    # The ansible.cfg venv interpreter does not exist until the python3 role runs.
    ansible_python_interpreter: /usr/bin/python3
