---
# Purpose: Clone a VM from a Proxmox template using Terraform.
# This module clones the VM on the same node as the template resides.
# It also defines the cloud-init configuration for the VM and
# defines additional disks if specified.

- name: Get Proxmox template information
  ansible.builtin.include_tasks: "get_vms_proxmox_template.yml"
  when: vms_proxmox_template is not defined

- name: Ensure Terraform module directory exists
  ansible.builtin.file:
    path: "{{ vms_terraform_module_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost

- name: Require the VM workflow lock before Terraform mutations
  ansible.builtin.assert:
    that:
      - vms_terraform_lock_depth | default(0) | int > 0
    fail_msg: "Terraform provisioning must run inside the locked VM workflow."

- name: Render Terraform module files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ vms_terraform_module_dir }}/{{ item.dest }}"
    mode: "0600"
  loop:
    - { src: "versions.tf.j2", dest: "versions.tf" }
    - { src: "variables.tf.j2", dest: "variables.tf" }
    - { src: "main.tf.j2", dest: "main.tf" }
    - { src: "outputs.tf.j2", dest: "outputs.tf" }
    - { src: "terraform.tfvars.j2", dest: "terraform.tfvars" }
  notify: Validate Terraform config
  delegate_to: localhost
  no_log: true
  diff: false

- name: Run terraform init
  ansible.builtin.command:
    cmd: terraform init -input=false
    chdir: "{{ vms_terraform_module_dir }}"
  changed_when: false
  delegate_to: localhost

- name: Validate initialized Terraform configuration
  ansible.builtin.meta: flush_handlers

- name: Inspect Terraform state before planning
  ansible.builtin.command:
    cmd: terraform show -json
    chdir: "{{ vms_terraform_module_dir }}"
  register: vms_terraform_state_output
  changed_when: false
  delegate_to: localhost
  no_log: true

- name: Decode Terraform state
  ansible.builtin.set_fact:
    vms_terraform_state: "{{ vms_terraform_state_output.stdout | from_json }}"
  no_log: true

- name: Validate Terraform ownership of the requested VM
  ansible.builtin.include_tasks: terraform_state_check.yml

- name: Remove stale Terraform failure diagnostics
  ansible.builtin.file:
    path: "{{ vms_terraform_module_dir }}/terraform-failure.log"
    state: absent
  delegate_to: localhost

- name: Plan and apply the validated Terraform module
  block:
    - name: Allocate an owner-only unique Terraform plan
      ansible.builtin.tempfile:
        path: "{{ vms_terraform_module_dir }}"
        state: file
        prefix: .ansible-plan-
        suffix: .tfplan
      register: vms_terraform_plan_file
      delegate_to: localhost

    - name: Run terraform plan
      ansible.builtin.command:
        argv:
          - terraform
          - plan
          - -input=false
          - "-out={{ vms_terraform_plan_file.path }}"
        chdir: "{{ vms_terraform_module_dir }}"
      register: vms_terraform_plan
      changed_when: false
      delegate_to: localhost
      no_log: true

    - name: Inspect the saved Terraform plan privately
      ansible.builtin.command:
        argv:
          - terraform
          - show
          - -json
          - "{{ vms_terraform_plan_file.path }}"
        chdir: "{{ vms_terraform_module_dir }}"
      register: vms_terraform_plan_output
      changed_when: false
      delegate_to: localhost
      no_log: true

    - name: Decode the saved Terraform plan privately
      ansible.builtin.set_fact:
        vms_terraform_plan_json: "{{ vms_terraform_plan_output.stdout | from_json }}"
      no_log: true

    - name: Validate provisioning actions before apply
      ansible.builtin.include_tasks: terraform_plan_check.yml
      vars:
        vms_terraform_plan_operation: provision

    - name: Run terraform apply
      ansible.builtin.command:
        argv:
          - terraform
          - apply
          - -input=false
          - "{{ vms_terraform_plan_file.path }}"
        chdir: "{{ vms_terraform_module_dir }}"
      register: vms_terraform_apply
      changed_when: vms_terraform_plan_has_changes | bool
      delegate_to: localhost
      no_log: true
  rescue:
    - name: Preserve Terraform failure diagnostics
      ansible.builtin.include_tasks: terraform_failure.yml
  always:
    - name: Clean up private Terraform artifacts
      ansible.builtin.include_tasks: terraform_cleanup.yml
