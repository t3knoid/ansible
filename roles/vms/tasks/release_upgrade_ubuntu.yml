---
- name: Verify supported Ubuntu release-upgrade source
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version == "24.04"
      - vms_ubuntu_release_upgrade_target_version == "26.04"
    fail_msg: >-
      This workflow supports Ubuntu 24.04 LTS upgrading to 26.04 LTS only.

- name: Upgrade installed Ubuntu packages first
  ansible.builtin.import_role:
    name: vms
    tasks_from: upgrade

- name: Check whether the package upgrade requires a reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: vms_ubuntu_release_upgrade_reboot_required

- name: Reboot after package upgrades
  ansible.builtin.reboot:
    reboot_timeout: 1800
  when: vms_ubuntu_release_upgrade_reboot_required.stat.exists

- name: Install Ubuntu release upgrader
  ansible.builtin.apt:
    name: update-manager-core
    state: present
    update_cache: true

- name: Configure LTS release upgrades
  ansible.builtin.lineinfile:
    path: /etc/update-manager/release-upgrades
    regexp: "^Prompt="
    line: "Prompt=lts"
    create: true
    mode: "0644"

- name: Start the Ubuntu LTS release upgrade
  ansible.builtin.command:
    argv:
      - do-release-upgrade
      - -f
      - DistUpgradeViewNonInteractive
  async: 14400
  poll: 0
  register: vms_ubuntu_release_upgrade_job
  changed_when: true
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Wait for the upgraded host to become reachable
  ansible.builtin.wait_for_connection:
    delay: 30
    connect_timeout: 10
    sleep: 15
    timeout: 7200

- name: Wait until Ubuntu reports the target release
  ansible.builtin.setup:
    gather_subset:
      - min
  register: vms_ubuntu_release_upgrade_facts
  until: >-
    vms_ubuntu_release_upgrade_facts.ansible_facts.ansible_distribution_version
    == vms_ubuntu_release_upgrade_target_version
  retries: 240
  delay: 30

- name: Check whether the release upgrade requires a final reboot
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: vms_ubuntu_release_upgrade_final_reboot_required

- name: Reboot after the release upgrade
  ansible.builtin.reboot:
    reboot_timeout: 1800
  when: vms_ubuntu_release_upgrade_final_reboot_required.stat.exists

- name: Gather Ubuntu facts after the final reboot
  ansible.builtin.setup:
    gather_subset:
      - min
  register: vms_ubuntu_release_upgrade_final_facts

- name: Confirm Ubuntu reached the requested release
  ansible.builtin.assert:
    that:
      - vms_ubuntu_release_upgrade_final_facts.ansible_facts.ansible_distribution == "Ubuntu"
      - vms_ubuntu_release_upgrade_final_facts.ansible_facts.ansible_distribution_version == vms_ubuntu_release_upgrade_target_version
    fail_msg: "Ubuntu did not reach {{ vms_ubuntu_release_upgrade_target_version }}."
