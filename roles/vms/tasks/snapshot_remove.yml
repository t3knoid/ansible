---

- name: Include get_vms_vmid tasks
  ansible.builtin.include_tasks: "get_vms_vmid.yml"
  when: vms_vmid is not defined

- name: Remove virtual machine snapshot
  community.proxmox.proxmox_snap:
    api_host: "{{ global_proxmox_api_host }}"
    api_user: "{{ global_proxmox_api_user }}"
    api_password: "{{ global_proxmox_api_password }}"
    vmid: "{{ vms_vmid | int }}"
    state: absent
    snapname: "{{ vms_snapshot_name | default('ansible_snapshot') }}"
    vmstate: false
    validate_certs: false
  register: vms_snapshot_remove
  # proxmox_snap exits successfully when the snapshot name does not exist.
  failed_when: >-
    vms_snapshot_remove.failed | default(false)
    or 'does not exist' in (vms_snapshot_remove.msg | default(''))
  when: vms_vmid is defined
  delegate_to: localhost
