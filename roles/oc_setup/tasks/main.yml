---
- name: Check if Omada Software Controller is already installed
  ansible.builtin.stat:
    path: /opt/tplink/EAPController/bin/tpeap
  register: oc_setup_installed

- name: Get installed Omada Software Controller version
  ansible.builtin.command: tpeap version
  register: oc_setup_installed_version_output
  changed_when: false
  when: oc_setup_installed.stat.exists

- name: Determine installed Omada Software Controller version
  ansible.builtin.set_fact:
    oc_setup_installed_version: "{{ oc_setup_installed_version_output.stdout | regex_search('[0-9]+(\\.[0-9]+)+') }}"
  when: oc_setup_installed.stat.exists

# The postinst script runs `tpeap start`, which does first-time MongoDB
# index setup and can legitimately take several minutes, not just a debconf prompt.
- name: Install Omada Software Controller (deb package)
  ansible.builtin.apt:
    deb: "{{ oc_setup_download_url }}"
    dpkg_options: ignore-depends=jsvc
  environment:
    DEBIAN_FRONTEND: noninteractive
  async: 1800
  poll: 15
  when: >-
    not oc_setup_installed.stat.exists
    or oc_setup_installed_version is version(oc_setup_version, '<')
