---
# see https://coder.com/docs/code-server/install#debian-ubuntu

- name: Gather service facts
  ansible.builtin.service_facts:

- name: Check installed code-server version
  ansible.builtin.command:
    argv:
      - dpkg-query
      - --show
      - "--showformat=${Version}"
      - code-server
  register: code_server_installed_version_output
  changed_when: false
  failed_when: false

- name: Check whether code-server requires a downgrade
  ansible.builtin.command:
    argv:
      - dpkg
      - --compare-versions
      - "{{ code_server_installed_version_output.stdout | trim }}"
      - gt
      - "{{ code_server_version | string }}"
  register: code_server_downgrade_check
  changed_when: false
  failed_when: code_server_downgrade_check.rc not in [0, 1]
  when:
    - code_server_installed_version_output.rc == 0
    - code_server_installed_version_output.stdout | trim | length > 0

- name: Stop the code-server package
  ansible.builtin.systemd:
    name: "{{ code_server_service_name }}"
    state: stopped
  when: ("code-server@" ~ code_server_user ~ ".service") in services

# Removing current installed version allows for downgrade
- name: Remove current version of code-server
  ansible.builtin.apt:
    name: code-server
    state: absent
  when:
    - not (code_server_downgrade_check.skipped | default(false))
    - code_server_downgrade_check.rc == 0

- name: Download code-server package
  ansible.builtin.get_url:
    url: "{{ code_server_download_url }}"
    dest: "/tmp/{{ code_server_download_file }}"
    mode: "0644"

- name: Install code-server package
  ansible.builtin.apt:
    deb: "/tmp/{{ code_server_download_file }}"
    state: present
  notify:
    - Restart code server

- name: Create code-server config folder
  ansible.builtin.file:
    state: directory
    path: "/home/{{ code_server_user }}/.config/code-server/"
    mode: "0755"
    owner: "{{ code_server_user }}"

- name: Create code-server config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "/home/{{ code_server_user }}/.config/code-server/config.yaml"
    mode: "0600"
    owner: "{{ code_server_user }}"
  notify:
    - Restart code server

- name: Enable code-server service
  ansible.builtin.include_tasks:
    file: enable.yml

- name: Cleanup downloaded file
  ansible.builtin.file:
    path: "/tmp/{{ code_server_download_file }}"
    state: absent

- name: Create or update Nginx site configuration
  ansible.builtin.template:
    src: code-server.conf.j2
    dest: "{{ nginx_setup_homedir }}/sites-available/code-server.conf"
    mode: "0644"
  notify: Restart nginx

- name: Enable Nginx site configuration
  ansible.builtin.file:
    src: "{{ nginx_setup_homedir }}/sites-available/code-server.conf"
    dest: "{{ nginx_setup_homedir }}/sites-enabled/code-server.conf"
    state: link
    force: true
  notify: Restart nginx

- name: Configure code-server update check
  ansible.builtin.import_tasks: check_update.yml
  when: code_server_check_update | bool
