---
- name: Install packages required for code-server update metrics
  ansible.builtin.apt:
    name:
      - cron
      - curl
      - jq
    state: present

- name: Ensure code-server update metrics directory exists
  ansible.builtin.file:
    path: "{{ code_server_update_metrics_path | dirname }}"
    state: directory
    owner: root
    group: "{{ node_exporter_setup_group | default('prometheus') }}"
    mode: "0775"

- name: Install code-server update metrics script
  ansible.builtin.template:
    src: check_code_server_update.sh.j2
    dest: "{{ code_server_update_check_script_path }}"
    owner: root
    group: root
    mode: "0750"

- name: Seed code-server update metrics
  ansible.builtin.command: "{{ code_server_update_check_script_path }}"
  changed_when: true

- name: Schedule code-server update metrics check
  ansible.builtin.cron:
    name: code_server_update_metrics
    minute: "{{ code_server_update_check_minute }}"
    user: root
    job: "{{ code_server_update_check_script_path }}"
