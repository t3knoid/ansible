---
- name: Configure DNS / network identity needed for the domain
  truenas_api:
    mode: config
    namespace: network.configuration
    config: "{{ truenas_network_configuration }}"
  when: truenas_network_configuration | length > 0

- name: Join / configure Active Directory
  truenas_api:
    mode: config
    namespace: directoryservices
    job: true
    config: "{{ truenas_ad_config }}"
    sensitive_keys: [credential]
    # Credentials are only sent when the join itself has to change.
    send_sensitive_when: [service_type, enable, configuration]
    companion_keys:
      configuration: [service_type]
  when: truenas_ad | length > 0
  no_log: "{{ truenas_no_log }}"

- name: Plan Active Directory changes
  truenas_api:
    mode: config
    namespace: directoryservices
    job: true
    config: "{{ truenas_ad_config }}"
    sensitive_keys: [credential]
    send_sensitive_when: [service_type, enable, configuration]
    companion_keys:
      configuration: [service_type]
  check_mode: true
  register: truenas_ad_plan
  changed_when: false
  when: truenas_ad | length > 0
  no_log: "{{ truenas_no_log }}"

- name: Refuse join-settings changes while AD is enabled
  ansible.builtin.assert:
    that:
      - (truenas_ad_plan.changed_keys | default([]))
        | difference(['enable_account_cache', 'enable_dns_updates', 'timeout'])
        | length == 0
        or truenas_ad_allow_reconfigure | default(false) | bool
    fail_msg: >-
      Changing {{ truenas_ad_plan.changed_keys | join(', ') }} requires disabling directory
      services (service interruption). Re-run in a maintenance window with
      -e truenas_ad_allow_reconfigure=true after disabling AD.
  when: truenas_ad | length > 0
