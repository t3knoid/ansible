---

- name: Ensure acl is installed (needed to become an unprivileged user)
  ansible.builtin.package:
    name: acl
    state: present
  become: true

- name: Ensure wiki mirror directory exists and is owned by the Redmine user
  ansible.builtin.file:
    path: "{{ redmine_setup_wiki_mirror_repo_path }}"
    state: directory
    owner: "{{ redmine_setup_user }}"
    group: "{{ redmine_setup_user }}"
    recurse: true  # also repairs ownership left over from earlier runs
  become: true

- name: Set git identity for redmine user
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  become: true
  become_user: "{{ redmine_setup_user }}"
  loop:
    - { name: user.name, value: "{{ redmine_setup_github_user_name }}" }
    - { name: user.email, value: "{{ redmine_setup_github_user_email }}" }

- name: Mirror wiki repo tasks (run as the Redmine user)
  become: true
  become_user: "{{ redmine_setup_user }}"
  block:
    - name: Ensure wiki mirror repo is cloned (HTTPS)
      ansible.builtin.git:
        repo: "{{ redmine_setup_wiki_mirror_repo_url }}"
        dest: "{{ redmine_setup_wiki_mirror_repo_path }}"
        version: main
        force: true
      environment:
        GIT_ASKPASS: /bin/echo
        GIT_USERNAME: "token"
        GIT_PASSWORD: "{{ redmine_setup_github_token }}"

    - name: Mirror Redmine wiki into local Git repo
      redmine_wiki_mirror:
        redmine_url: "{{ redmine_setup_url }}"
        project: "{{ redmine_setup_project }}"
        api_key: "{{ redmine_setup_api_key }}"
        output_dir: "{{ redmine_setup_wiki_mirror_repo_path }}"
        filename_extension: "{{ redmine_setup_wiki_mirror_extension }}"
        rewrite_links: true
        delete_stale: true
        debug: "{{ redmine_setup_wiki_mirror_debug }}"
      register: redmine_setup_wiki_mirror

    - name: Report Redmine wiki mirror result
      ansible.builtin.debug:
        msg:
          - "Wiki pages found: {{ redmine_setup_wiki_mirror.wiki_pages_found }}"
          - "Pages synced: {{ redmine_setup_wiki_mirror.synced_pages | length }}"
          - "Pages deleted: {{ redmine_setup_wiki_mirror.deleted_pages | length }}"

    - name: Show Redmine wiki mirror debug log
      ansible.builtin.debug:
        var: redmine_setup_wiki_mirror.debug_log
      when: redmine_setup_wiki_mirror_debug | bool

    - name: Stage wiki mirror changes # noqa: command-instead-of-module
      ansible.builtin.command: git add -A --verbose
      args:
        chdir: "{{ redmine_setup_wiki_mirror_repo_path }}"
      register: redmine_setup_staged_files
      changed_when: redmine_setup_staged_files.stdout != ""
      notify:
        - Commit wiki mirror changes
        - Push wiki mirror changes over HTTPS
