---
- name: Check whether the Radarr container exists
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - --all
      - --quiet
      - --filter
      - name=^/radarr$
  register: radarr_setup_start_existing_container
  changed_when: false
  check_mode: false

- name: Require an existing Radarr container
  ansible.builtin.assert:
    that:
      - radarr_setup_start_existing_container.stdout | trim | length > 0
    fail_msg: "The radarr container does not exist. Deploy Radarr before using the start playbook."

- name: Check whether the Radarr container is running
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - --quiet
      - --filter
      - name=^/radarr$
  register: radarr_setup_start_running_container
  changed_when: false
  check_mode: false

- name: Start the Radarr container
  ansible.builtin.command:
    argv:
      - docker
      - start
      - radarr
  when: radarr_setup_start_running_container.stdout | trim | length == 0
  changed_when: true
