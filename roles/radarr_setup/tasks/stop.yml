---
- name: Check whether the radarr container is running
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - --quiet
      - --filter
      - name=^/radarr$
  register: radarr_setup_stop_running_container
  changed_when: false
  check_mode: false

- name: Stop the radarr container
  ansible.builtin.command:
    argv:
      - docker
      - stop
      - radarr
  when: radarr_setup_stop_running_container.stdout | trim | length > 0
  changed_when: true
