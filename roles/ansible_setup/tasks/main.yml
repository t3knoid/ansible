---
- name: Create ansible work folder
  ansible.builtin.file:
    path: "{{ ansible_setup_workdir }}"
    state: directory
    mode: "0755"
  become: false

- name: Install Ansible Python modules
  ansible.builtin.include_tasks: install_python_modules.yml

- name: Ensure Azure Ansible collection is installed
  ansible.builtin.command:
    argv:
      - "{{ python3_venv_folder }}/bin/ansible-galaxy"
      - collection
      - install
      - "azure.azcollection:{{ ansible_setup_azure_collection_version }}"
  become: false
  register: ansible_setup_azure_collection_install
  changed_when: "'was installed successfully' in ansible_setup_azure_collection_install.stdout"

- name: Checkout Ansible source code from github
  ansible.builtin.include_tasks: checkout_source.yml
  when: ansible_setup_checkout_source | default(false)

- name: Create vault password file
  ansible.builtin.template:
    src: vault_pass.txt.j2
    dest: "~/.vault_pass.txt"
    mode: "0664"
  become: false
