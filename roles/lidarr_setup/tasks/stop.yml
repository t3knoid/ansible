---
- name: Check whether the Lidarr container is running
  ansible.builtin.command:
    argv:
      - docker
      - ps
      - --quiet
      - --filter
      - name=^/lidarr$
  register: lidarr_setup_stop_running_container
  changed_when: false
  check_mode: false

- name: Stop the Lidarr container
  ansible.builtin.command:
    argv:
      - docker
      - stop
      - lidarr
  when: lidarr_setup_stop_running_container.stdout | trim | length > 0
  changed_when: true
