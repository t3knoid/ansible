---
- name: Show current item server name
  ansible.builtin.debug:
    msg: "Processing server_name: {{ item.server_name }}"

# Check if the application exists before trying to create it
# if it already exists, store the app_id for downstream tasks
# and skip creation.
- name: Get existing application by display name
  no_log: true
  azure.azcollection.azure_rm_adapplication_info:
    app_display_name: "{{ item.server_name }}"
    client_id: "{{ global_azure_sp_client_id }}"
    secret: "{{ global_azure_sp_secret }}"
    tenant: "{{ global_azure_tenant }}"
    subscription_id: "{{ global_azure_subscription_id }}"
  register: entra_id_oauth2_existing_app
  delegate_to: localhost

- name: Show message app does not exist
  ansible.builtin.debug:
    msg: "New application {{ item.server_name }} will be created."
  when: entra_id_oauth2_existing_app.applications | length == 0

- name: Build redirect URI list for application registration
  ansible.builtin.set_fact:
    entra_id_oauth2_reply_urls: >-
      {{
        (
          [item.app_redirect_url]
          if (item.app_redirect_url is defined and (item.app_redirect_url | length > 0))
          else [item.oauth2_callback_url | default('')]
        )
        | reject('equalto', '')
        | list
        | unique
      }}

- name: Create application if it does not exist
  no_log: true
  azure.azcollection.azure_rm_adapplication:
    display_name: "{{ item.server_name }}"
    identifier_uris: ["api://{{ item.server_name }}"]
    reply_urls: "{{ entra_id_oauth2_reply_urls }}"
    client_id: "{{ global_azure_sp_client_id }}"
    secret: "{{ global_azure_sp_secret }}"
    tenant: "{{ global_azure_tenant }}"
    subscription_id: "{{ global_azure_subscription_id }}"
    state: present
  register: entra_id_oauth2_created_app
  delegate_to: localhost
  when: entra_id_oauth2_existing_app.applications | length == 0

- name: Set app_id to either existing or created app
  ansible.builtin.set_fact:
    entra_id_oauth2_app_id: >-
      {{
        (
          (entra_id_oauth2_existing_app is defined and
           (entra_id_oauth2_existing_app.applications | default([])) | length > 0 and
           entra_id_oauth2_existing_app.applications[0].app_id) or
          (entra_id_oauth2_created_app is defined and
           entra_id_oauth2_created_app.app_id | default(''))
        ) | default('')
      }}

- name: Ensure redirect URIs are updated for the application
  ansible.builtin.command: >
    az ad app update
    --id {{ entra_id_oauth2_app_id }}
    --web-redirect-uris {{ entra_id_oauth2_reply_urls | join(' ') }}
  delegate_to: localhost
  changed_when: false
  when: entra_id_oauth2_reply_urls | length > 0

# The application id is now in the variable entra_id_oauth2_app_id

# Azure does not return an existing client secret
- name: Retrieve existing credential metadata
  ansible.builtin.command: >
    az ad app credential list
    --id {{ entra_id_oauth2_app_id }}
    --query "[].{keyId:keyId,endDateTime:endDateTime}" -o json
  register: entra_id_oauth2_existing_keys
  delegate_to: localhost
  changed_when: false

- name: Identify unexpired credentials
  ansible.builtin.set_fact:
    entra_id_oauth2_valid_keys: >-
      {{
        (entra_id_oauth2_existing_keys.stdout | from_json)
        | selectattr('endDateTime', 'defined')
        | selectattr('endDateTime', 'gt', lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ'))
        | list
      }}

- name: Identify expired credentials
  ansible.builtin.set_fact:
    entra_id_oauth2_expired_keys: >-
      {{
        (entra_id_oauth2_existing_keys.stdout | from_json)
        | selectattr('endDateTime', 'defined')
        | selectattr('endDateTime', 'lt', lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ'))
        | list
      }}

- name: Set configured client secret as the effective secret
  ansible.builtin.set_fact:
    entra_id_oauth2_effective_secret: "{{ item.oauth2_client_secret | default('') }}"

- name: Select credentials to delete
  ansible.builtin.set_fact:
    entra_id_oauth2_keys_to_delete: >-
      {{
        (entra_id_oauth2_existing_keys.stdout | from_json)
        if entra_id_oauth2_force_secret_rotation | default(false) | bool
        else entra_id_oauth2_expired_keys
      }}

- name: Wait 5 seconds before deleting credentials to avoid concurrency issues
  ansible.builtin.pause:
    seconds: 5
  when:
    - entra_id_oauth2_keys_to_delete | length > 0

- name: Delete selected credentials
  no_log: true
  ansible.builtin.command: >
    az ad app credential delete
    --id {{ entra_id_oauth2_app_id }}
    --key-id {{ item_key.keyId }}
  loop: "{{ entra_id_oauth2_keys_to_delete }}"
  loop_control:
    loop_var: item_key
  delegate_to: localhost
  when:
    - entra_id_oauth2_keys_to_delete | length > 0
  changed_when: false

- name: Wait 5 seconds after deleting credentials to avoid concurrency issues
  ansible.builtin.pause:
    seconds: 5
  when:
    - entra_id_oauth2_keys_to_delete | length > 0

- name: Wait 5 seconds before generating client secret to avoid concurrency issues
  ansible.builtin.pause:
    seconds: 5
  when:
    - entra_id_oauth2_force_secret_rotation | default(false) | bool or entra_id_oauth2_valid_keys | length == 0

- name: Generate client secret when missing or expired
  no_log: true
  ansible.builtin.command: >
    az ad app credential reset
    --id {{ entra_id_oauth2_app_id }}
    --append
    --display-name "Generated by Ansible on {{ ansible_date_time.date }}"
    --end-date {{ entra_id_oauth2_secret_expiry }}
    --query password -o tsv
  register: entra_id_oauth2_secret
  delegate_to: localhost
  changed_when: true
  retries: 8
  delay: 5
  until: entra_id_oauth2_secret.rc == 0
  when:
    - entra_id_oauth2_force_secret_rotation | default(false) | bool or entra_id_oauth2_valid_keys | length == 0

- name: Wait 5 seconds after generating client secret to avoid concurrency issues
  ansible.builtin.pause:
    seconds: 5
  when:
    - entra_id_oauth2_force_secret_rotation | default(false) | bool or entra_id_oauth2_valid_keys | length == 0

- name: Use generated client secret when rotation was required
  ansible.builtin.set_fact:
    entra_id_oauth2_effective_secret: "{{ entra_id_oauth2_secret.stdout }}"
  when: entra_id_oauth2_secret is defined and entra_id_oauth2_secret is changed

# Create a mapping using the current server name to registered application's app_id
# and generated client secret. This mapping will be used in downstream tasks
# to build an updated list of sites with the correct client IDs and client secrets
# injected.
- name: Create a mapping using the current server name to registered application's app_id
  ansible.builtin.set_fact:
    entra_id_oauth2_site_client_map: >-
      {{
        (entra_id_oauth2_site_client_map | default({}))
        | combine({
            item.server_name: {
              'client_id': (entra_id_oauth2_app_id | default('')),
              'client_secret': (entra_id_oauth2_effective_secret | default(''))
              }
          }, recursive=True)
      }}
