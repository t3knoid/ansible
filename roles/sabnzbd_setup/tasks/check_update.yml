---
- name: Ensure jq is installed for SABnzbd update metrics
  ansible.builtin.package:
    name: jq
    state: present

- name: Ensure cron is installed for SABnzbd update metrics
  ansible.builtin.package:
    name: cron
    state: present

- name: Ensure SABnzbd update metrics directory exists
  ansible.builtin.file:
    path: "{{ sabnzbd_setup_update_metrics_path | dirname }}"
    state: directory
    owner: root
    group: "{{ node_exporter_setup_group | default('prometheus') }}"
    mode: "0775"

- name: Install SABnzbd update metrics script
  ansible.builtin.template:
    src: check_sabnzbd_update.sh.j2
    dest: "{{ sabnzbd_setup_update_check_script_path }}"
    owner: root
    group: root
    mode: "0750"
  no_log: true

- name: Seed SABnzbd update metrics file
  ansible.builtin.command: "{{ sabnzbd_setup_update_check_script_path }}"
  changed_when: true

- name: Schedule SABnzbd update metrics check
  ansible.builtin.cron:
    name: sabnzbd_update_metrics
    minute: "{{ sabnzbd_setup_update_check_minute }}"
    user: root
    job: "{{ sabnzbd_setup_update_check_script_path }}"
