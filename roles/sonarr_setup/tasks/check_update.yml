---
- name: Read deployed Sonarr config file for update check
  no_log: true
  ansible.builtin.slurp:
    src: "{{ sonarr_setup_config_dir }}/config.xml"
  register: sonarr_setup_update_check_config_xml
  changed_when: false

- name: Extract ApiKey from sonarr config file for update check
  community.general.xml:
    xmlstring: "{{ sonarr_setup_update_check_config_xml.content | b64decode }}"
    xpath: /Config/ApiKey
    content: text
  no_log: true
  register: sonarr_setup_update_check_api_key

- name: Resolve Sonarr API key for update check
  ansible.builtin.set_fact:
    sonarr_setup_resolved_update_check_api_key: "{{ sonarr_setup_update_check_api_key.matches[0].ApiKey | trim }}"
  no_log: true

- name: Ensure jq is installed for Sonarr update metrics
  ansible.builtin.package:
    name: jq
    state: present

- name: Ensure Sonarr update metrics directory exists
  ansible.builtin.file:
    path: "{{ sonarr_setup_update_metrics_path | dirname }}"
    state: directory
    owner: root
    group: "{{ node_exporter_setup_group | default('prometheus') }}"
    mode: "0775"

- name: Install Sonarr update metrics script
  ansible.builtin.template:
    src: check_sonarr_update.sh.j2
    dest: "{{ sonarr_setup_update_check_script_path }}"
    owner: root
    group: root
    mode: "0750"
  no_log: true

- name: Seed Sonarr update metrics file
  ansible.builtin.command: "{{ sonarr_setup_update_check_script_path }}"
  changed_when: true

- name: Schedule Sonarr update metrics check
  ansible.builtin.cron:
    name: sonarr_update_metrics
    minute: "{{ sonarr_setup_update_check_minute }}"
    user: root
    job: "{{ sonarr_setup_update_check_script_path }}"
