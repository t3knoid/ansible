---

postgresql_setup_version: 17

ecube_setup_no_tls: true
ecube_setup_demo: false
ecube_setup_version: "0.2.0"

rproxy_setup_cloudflare_only: true

rproxy_setup_sites:
  - server_name: demo.ecube.one
    port: "80" # Set to 8443 if ecube_setup_no_tls is true
    proxy_pass: "http://{{ global_ip_addresses['ecube-1'] }}"
    allow_list:
      - 192.168.0.0/24
      - 192.168.2.0/24
      - 24.105.250.200
      - 70.107.117.124
    restricted: false
    enable: true
