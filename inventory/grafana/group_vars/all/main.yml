---
vms_config:
  agent: "1"
  cores: "2"
  cpu: host
  memory: 2048
  ostype: l26
  scsihw: local
  sockets: 1
  storage: local
  disk_os:
    disk: virtio0
    backup: true
    size: 20
    storage: local
  disk2:
    disk: virtio1
    backup: true
    size: 30
    storage: local

vms_os: ubuntu_24_server
vms_autoinstall: true
vms_enable_serial_terminal: false
vms_additional_packages: []
python3_version: 3.12
python3_venv_folder: "/opt/python_{{ python3_version }}"

disks_disk_mounts:
  - {
      mountpoint: "/data",
      mountpoint_owner: "{{ users_list[0].username }}",
      mountpoint_group: "{{ users_list[0].username }}",
    }

nginx_setup_disable_default_site: true

postgresql_setup_version: 17

grafana_setup_http_port: 3000
grafana_setup_domain: "grafana.refol.us"
grafana_setup_protocol: "https"
grafana_setup_version: "12.2.0"
grafana_setup_edition: "grafana-enterprise"
grafana_setup_auth_anonymous_enabled: true
grafana_setup_auth_anonymous_org_name: "Main Org."
grafana_setup_auth_anonymous_org_role: "Viewer"
grafana_setup_auth_anonymous_hide_version: false
grafana_setup_auth_disable_login_form: true
grafana_setup_auth_azuread_enabled: true
grafana_setup_auth_azuread_allowed_domains: ""

rproxy_setup_sites:
  - server_name: grafana.refol.us
    port: "{{ grafana_setup_http_port }}"
    proxy_pass: "http://{{ global_ip_addresses['grafana-0'] }}"
    allow_list:
      - 192.168.0.0/24
      - 192.168.2.0/24
      - 24.105.250.200
      - 70.107.117.124
    restricted: false
    use_oauth2: false
    use_entra_id_oidc: true
    oauth2_provider: "entra-id"
    oauth2_scope: "openid profile email"
    oauth2_client_id: ""
    oauth2_callback_url: "https://grafana.refol.us/login/azuread"
    oauth2_client_secret: ""
    oauth2_email_domains: "*"
