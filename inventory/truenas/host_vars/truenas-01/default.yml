---
rproxy_setup_sites:
  - server_name: truenas.refol.us
    port: 80
    proxy_pass: "http://{{ global_ip_addresses['truenas-01'] }}"
    allow_list:
      - 192.168.0.0/24
      - 192.168.2.0/24
      - 24.105.250.200
      - 70.107.117.124
    restricted: false

truenas_update_enabled: false
truenas_update_reboot: false

truenas_groups:
  - { name: abc, gid: 2000 }
  - { name: backup_user, gid: 3000 }
  - { name: incoming, gid: 3001 }
  - { name: proxmox, gid: 3002 }

truenas_admin:
  username: admin
  uid: 950
  password: "{{ vault_truenas_admin_password }}"
  full_name: Administrator
  ssh_password_enabled: true
  sudo_commands_nopasswd: [ALL]

truenas_users:
  - username: frank
    uid: 900
    full_name: Frank Refol
    password: "{{ vault_frank_password }}"
    smb: true
    group_create: false
    group: ansible
    groups: [ansible]
    shell: /usr/bin/zsh
    ssh_password_enabled: true
    home: /mnt/Data/users/frank
  - username: abc
    uid: 2000
    full_name: abc
    password: "{{ vault_abc_password }}"
    password_disabled: false
    ssh_password_enabled: false
    smb: true
    group_create: false
    group: abc
    groups: [abc]
    shell: /usr/sbin/nologin
    home: /var/empty
  - username: ansible
    uid: 1000
    full_name: Ansible
    password: "{{ vault_ansible_password }}"
    smb: false
    group_create: false
    group: ansible
    groups: [ansible]
    shell: /usr/bin/zsh
    ssh_password_enabled: true
    home_create: true
    home: /mnt/Data/users/ansible
  - username: backup_user
    uid: 3000
    full_name: Backup User
    password: "{{ vault_backupuser_password }}"
    password_disabled: false
    smb: true
    group_create: false
    group: backup_user
    groups: [backup_user]
    shell: /usr/sbin/nologin
    ssh_password_enabled: false
    home: /var/empty
  - username: incoming
    uid: 3001
    full_name: Incoming User
    password: "{{ vault_incoming_password }}"
    password_disabled: false
    smb: true
    group_create: false
    group: incoming
    groups: [incoming]
    shell: /usr/sbin/nologin
    ssh_password_enabled: false
    home: /var/empty
  - username: proxmox
    uid: 3002
    full_name: Proxmox User
    random_password: true
    password_disabled: false
    smb: false
    group_create: false
    group: proxmox
    groups: [proxmox]
    shell: /usr/sbin/nologin
    ssh_password_enabled: false
    home: /var/empty

truenas_network_configuration:
  nameserver1: 192.168.20.253
truenas_ad:
  domain: refol.us
  hostname: truenas
  username: svc-truenas-join
  password: "{{ vault_ad_join_password }}"

