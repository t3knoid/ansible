---

vms_config:
  agent: "1"
  cores: "2"
  cpu: host
  memory: 4096
  ostype: l26
  scsihw: virtio-scsi-single
  sockets: 1
  storage: local
  disk_os:
    disk: virtio0
    backup: true
    size: 30
    storage: local

autofs_nfs_mounts:
  - mount_name: books
    server: 192.168.2.250:/mnt/Data/books
    mount_options: -rw,relatime,hard,rsize=1048576,wsize=1048576,proto=tcp,timeo=600,retrans=2,sec=sys
    container_path: /books
  - mount_name: downloads
    server: 192.168.2.250:/mnt/Data/downloads/complete
    mount_options: -rw,relatime,hard,rsize=1048576,wsize=1048576,proto=tcp,timeo=600,retrans=2,sec=sys
    container_path: /downloads
  - mount_name: backups
    server: 192.168.2.250:/mnt/Data/backups_ex
    mount_options: -rw,relatime,hard,rsize=1048576,wsize=1048576,proto=tcp,timeo=600,retrans=2,sec=sys
    container_path: /backups

rproxy_setup_sites:
  - server_name: lazy.refol.us
    port: 5299
    proxy_pass: "http://{{ global_ip_addresses['books-0'] }}"
    allow_list:
      - 192.168.0.0/24
      - 192.168.2.0/24
      - 24.105.250.200
      - 70.107.117.124
    restricted: false
    use_oauth2: true
    oauth2_provider: "entra-id"
    oauth2_scope: "openid profile email"
    oauth2_cookie_secret: "l0fsUypuYUOMZxZog9A2q5N8sg1lOE_yQj0RGus2V14="
    oauth2_client_id: ""
    oauth2_callback_url: "https://lazy.refol.us/oauth2/callback"
    oauth2_client_secret: ""
    oauth2_email_domains: "*"
    oauth2_proxy_port: 4185
    oauth2_proxy_metrics_port: 9105
    enable: true
  - server_name: books.refol.us
    port: 8083
    proxy_pass: "http://{{ global_ip_addresses['books-0'] }}"
    allow_list:
      - 192.168.0.0/24
      - 192.168.2.0/24
      - 24.105.250.200
      - 70.107.117.124
    restricted: false
    use_oauth2: false
    use_entra_id_oidc: false
    enable: true
  - server_name: catalog.refol.us
    port: 8081
    proxy_pass: "http://{{ global_ip_addresses['books-0'] }}"
    allow_list:
      - 192.168.0.0/24
      - 192.168.2.0/24
      - 24.105.250.200
      - 70.107.117.124
    restricted: false
    use_oauth2: true
    use_entra_id_oidc: true
    oauth2_provider: "entra-id"
    oauth2_scope: "openid profile email"
    oauth2_cookie_secret: "sMPVF1klBHROYIQrqLfVa-t09IowPWGUUO43qeShDaI="
    oauth2_client_id: ""
    oauth2_callback_url: "https://catalog.refol.us/oauth2/callback"
    oauth2_client_secret: ""
    oauth2_email_domains: "*"
    oauth2_proxy_port: 4186
    oauth2_proxy_metrics_port: 9106
    enable: true

calibreweb_setup_version: 0.6.25 # https://hub.docker.com/r/linuxserver/calibre-web
calibre_setup_version: 8.16.2 # see https://hub.docker.com/r/linuxserver/calibre
lazylibrarian_setup_version: 488271c5 # see https://hub.docker.com/r/linuxserver/lazylibrarian
