---

vms_config:
  agent: "1"
  cores: "2"
  cpu: host
  memory: 2048
  ostype: l26
  scsihw: virtio-scsi-single
  sockets: 1
  storage: local
  disk_os:
    disk: virtio0
    backup: true
    size: 20
    storage: local

autofs_nfs_mounts:
  - mount_name: tvshows
    server: 192.168.2.250:/mnt/Data/tvshows
    mount_options: -rw,relatime,hard,rsize=1048576,wsize=1048576,proto=tcp,timeo=600,retrans=2,sec=sys
    container_path: /tv
  - mount_name: downloads
    server: 192.168.2.250:/mnt/Data/downloads/complete
    mount_options: -rw,relatime,hard,rsize=1048576,wsize=1048576,proto=tcp,timeo=600,retrans=2,sec=sys
    container_path: /downloads
  - mount_name: incomplete-downloads
    server: 192.168.2.250:/mnt/Data/downloads/incomplete
    mount_options: -rw,relatime,hard,rsize=1048576,wsize=1048576,proto=tcp,timeo=600,retrans=2,sec=sys
    container_path: /incomplete-downloads
  - mount_name: backups
    server: 192.168.2.250:/mnt/Data/backups_ex/sonarr
    mount_options: -rw,relatime,hard,rsize=1048576,wsize=1048576,proto=tcp,timeo=600,retrans=2,sec=sys
    container_path: /config/Backups

rproxy_setup_sites:
  - server_name: sonarr.refol.us
    port: 8989
    proxy_pass: "http://{{ global_ip_addresses['sonarr-0'] }}"
    allow_list:
      - 192.168.0.0/24
      - 192.168.2.0/24
      - 24.105.250.200
      - 70.107.117.124
    restricted: false
    nginx_setup_api_location_block: |
      # Allow the API External Access via NGINX
          location ~ /sonarr/api {
              auth_basic off;
              proxy_pass http://{{ global_ip_addresses['sonarr-0'] }}:8989;
          }
    use_oauth2: true
    oauth2_provider: "entra-id"
    oauth2_scope: "openid profile email"
    oauth2_cookie_secret: "2mrsvQ-jHoMMsx1k-bQrDhgJlSnpTK-rHMvXx_EkNeY="
    oauth2_client_id: ""
    oauth2_callback_url: "https://sonarr.refol.us/oauth2/callback"
    oauth2_client_secret: ""
    oauth2_email_domains: "*"
    oauth2_proxy_port: 4183
    oauth2_proxy_metrics_port: 9103
    enable: true

sonarr_setup_version: 4.0.19.2979
