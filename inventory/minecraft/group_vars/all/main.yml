---

vms_config:
  agent: "1"
  cores: "2"
  cpu: host
  memory: 4096
  ostype: l26
  scsihw: virtio-scsi-single
  sockets: 1
  storage: local
  disk_os:
    disk: virtio0
    backup: true
    size: 20
    storage: local
  disk2:
    disk: virtio1
    backup: true
    size: 20
    storage: local
  network:
    nic0:
      model: virtio
      bridge: vmbr0
      tag: 20

vms_os: ubuntu_24_server
vms_autoinstall: true
vms_enable_serial_terminal: false
vms_additional_packages: []

python3_version: 3.12
python3_venv_folder: "/opt/python_{{ python3_version }}"
ansible_python_interpreter: "{{ python3_venv_folder }}/bin/python3"

disks_disk_mounts:
  - { mountpoint: "/minecraft", mountpoint_owner: "ansible", mountpoint_group: "ansible" }

bedrock_setup_version: 1.26.52.3

node_exporter_port: 9200
