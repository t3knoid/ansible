---
nginx_setup_disable_default_site: true

rproxy_setup_sites:
  - server_name: auth.refol.us
    port: 4180
    proxy_pass: "http://{{ global_ip_addresses['rproxy-0'] }}"
    allow_list:
      - 192.168.0.0/24
      - 192.168.2.0/24
      - 24.105.250.200
      - 70.107.117.124
    restricted: false
    enable: false

python3_version: 3.12
python3_venv_folder: "/opt/python_{{ python3_version }}"
ansible_python_interpreter: "{{ python3_venv_folder }}/bin/python3"

azure_cli_setup_version: 2.91.0
redis_setup_version: 6:8.10.2-1rl1
